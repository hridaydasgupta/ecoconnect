spring.application.name=ecoconnect-backend

# ---- Update these with your local Postgres details ----
spring.datasource.url=jdbc:postgresql://localhost:5432/ecoconnect
spring.datasource.username=postgres
spring.datasource.password=post1024

# 'update' lets Hibernate auto-create/alter tables while learning.
# Once stable, switch to 'validate' and manage schema via the SQL file instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT config (change this secret before going to production!)
jwt.secret=ecoConnectSuperSecretKeyChangeThisBeforeProduction123456
jwt.expiration-ms=86400000
